server {
    server_name ccs.yunlk.icu;

    access_log /var/log/nginx/ccs.yunlk.icu.access.log;
    error_log  /var/log/nginx/ccs.yunlk.icu.error.log;

    client_max_body_size 4m;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ccs.yunlk.icu/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ccs.yunlk.icu/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # ????????
    location = / {
        return 302 /scorewall/?view=standings;
    }

    # ???????
    location ~ ^/(config|api/config) {
        auth_basic           "ICPC ???";
        auth_basic_user_file /etc/nginx/.htpasswd_ccs;
        include /etc/nginx/snippets/ccs-proxy.conf;
    }

    # ??????????????????
    location / {
        include /etc/nginx/snippets/ccs-proxy.conf;
    }
}

server {
    if ($host = ccs.yunlk.icu) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name ccs.yunlk.icu;
    return 404;
}
